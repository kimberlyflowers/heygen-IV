[project]
name = "heygen-iv"
version = "0.1.0"
description = "Facial landmark tracking using MediaPipe"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mediapipe==0.10.31",
    "opencv-python-headless==4.12.0.88",
    "numpy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    # Development tools
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
]
